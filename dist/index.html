<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="一个为视频创作者准备的轻量从夯到拉分档看板。" />
  <title>夯拉板</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M14 16h36v9H14zm0 13h28v9H14zm0 13h20v9H14z' fill='%23f3ff63'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #12151a;
      --panel-2: #171b21;
      --line: #2a3039;
      --text: #f5f6f7;
      --muted: #9aa3ae;
      --accent: #eaff5b;
      --accent-ink: #151800;
      --danger: #ff6d68;
      --tile: 92px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }

    body {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      min-height: 42px;
      padding: 0 15px;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    button:hover { border-color: #4b5563; background: #20252d; }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .58; transform: none; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(234,255,91,.38); outline-offset: 2px; }

    .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 800; }
    .primary:hover { background: #f1ff91; border-color: #f1ff91; }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(11,13,16,.94);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(16px);
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 190px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 24px; font-weight: 1000; transform: rotate(-3deg); }
    .brand h1 { margin: 0; font-size: 1.08rem; letter-spacing: .01em; }
    .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: .78rem; }

    .actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
    .button-icon { display: inline-block; margin-right: 7px; font-weight: 900; }
    .theme-control { min-height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 11px 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--muted); font-size: .88rem; }
    .theme-control select { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
    .theme-control select:focus { outline: 0; }

    .room-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 24px; border-bottom: 1px solid #294534; background: #101b15; color: #dfffea; }
    .room-info, .room-actions, .room-people { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .online-dot { width: 9px; height: 9px; border-radius: 50%; background: #63e08b; box-shadow: 0 0 0 4px rgba(99,224,139,.12); }
    .room-code { color: #fff; font-weight: 900; letter-spacing: .12em; }
    .room-people { color: #a9c5b3; font-size: .88rem; }
    .room-bar button { min-height: 34px; padding: 0 11px; border-color: #31553e; background: #17271d; }
    .room-bar .finalize { color: #10180d; border-color: #9ee874; background: #9ee874; font-weight: 800; }
    .room-final-label { display: none; padding: 5px 10px; border-radius: 99px; color: #171400; background: #f4dc66; font-size: .82rem; font-weight: 900; }
    body.room-finalized .room-final-label { display: inline-flex; }
    body.room-finalized .tier-drop, body.room-finalized .asset-bank, body.room-finalized .tier-tools { pointer-events: none; opacity: .78; }

    .room-modal { position: fixed; inset: 0; z-index: 150; display: none; place-items: center; padding: 20px; background: rgba(4,6,8,.78); backdrop-filter: blur(10px); }
    .room-modal.open { display: grid; }
    .room-dialog { width: min(520px, 100%); border: 1px solid #343c47; border-radius: 18px; background: #12161b; box-shadow: 0 28px 100px rgba(0,0,0,.55); overflow: hidden; }
    .room-dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 22px 22px 14px; }
    .room-dialog h2 { margin: 0 0 6px; font-size: 1.35rem; }
    .room-dialog p { margin: 0; color: var(--muted); line-height: 1.55; font-size: .9rem; }
    .room-close { width: 36px; height: 36px; min-height: 36px; padding: 0; border: 0; background: transparent; font-size: 1.4rem; }
    .room-form { display: grid; gap: 14px; padding: 8px 22px 24px; }
    .room-field { display: grid; gap: 7px; }
    .room-field label { color: #cdd3da; font-size: .86rem; font-weight: 700; }
    .room-field input, .room-field select { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #343c47; border-radius: 10px; background: #0d1014; color: var(--text); font-size: 1rem; }
    .room-field input.room-number { text-align: center; font-size: 1.3rem; font-weight: 900; letter-spacing: .2em; }
    .room-choice { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 13px; }
    .room-or { align-self: center; color: #68717d; font-size: .78rem; }
    .room-submit { width: 100%; }
    .room-note { padding-top: 3px; color: #7f8995 !important; font-size: .8rem !important; }
    .host-exit-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .danger-action { border-color: #773b3b; color: #ffd2d0; background: #361b1b; }

    .workspace { width: min(1500px, 100%); margin: 0 auto; padding: 24px; flex: 1; }

    .board-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    .board-title { display: block; width: min(720px, 80vw); margin: 0 0 6px; padding: 2px 0 5px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--text); font-size: clamp(1.35rem, 2vw, 2rem); line-height: 1.1; font-weight: 800; }
    .board-title:hover { border-bottom-color: var(--line); }
    .board-title:focus { border-bottom-color: var(--accent); outline: 0; }
    .board-title::placeholder { color: #6f7782; }
    .board-header p { color: var(--muted); margin: 0; font-size: .9rem; }

    .board {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0,0,0,.26);
    }

    .tier {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr) 92px;
      min-height: 116px;
      border-bottom: 1px solid var(--line);
    }
    .tier:last-child { border-bottom: 0; }

    .tier-name {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px;
      background: var(--tier-color);
    }

    .tier-name input {
      width: 100%;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #151515;
      text-align: center;
      font-size: 1rem;
      font-weight: 1000;
      padding: 8px 2px;
    }
    .tier-name input:hover, .tier-name input:focus { border-bottom-color: rgba(0,0,0,.28); outline: 0; }

    .tier-drop {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      min-width: 0;
      padding: 11px;
      background-image: linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .tier-drop.drag-over, .asset-bank.drag-over { background-color: rgba(234,255,91,.08); box-shadow: inset 0 0 0 2px var(--accent); }

    .tier-tools { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 4px; border-left: 1px solid var(--line); }
    .drag-tier { width: 36px; height: 36px; min-height: 36px; padding: 0; color: var(--muted); border: 0; background: transparent; font-size: 1.2rem; cursor: grab; letter-spacing: -4px; }
    .drag-tier:hover { color: var(--accent); background: rgba(234,255,91,.08); }
    .drag-tier:active { cursor: grabbing; }
    .delete-tier { width: 36px; height: 36px; min-height: 36px; padding: 0; color: var(--muted); border: 0; background: transparent; font-size: 1.25rem; }
    .delete-tier:hover { color: var(--danger); background: rgba(255,109,104,.1); }
    .tier.tier-drag-before { box-shadow: inset 0 4px 0 var(--accent); }
    .tier.tier-drag-after { box-shadow: inset 0 -4px 0 var(--accent); }

    .tile {
      position: relative;
      width: var(--tile);
      height: var(--tile);
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.13);
      background: #252a32;
      cursor: grab;
      box-shadow: 0 6px 14px rgba(0,0,0,.24);
      user-select: none;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { opacity: .35; }
    .tile img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
    .tile button { position: absolute; top: 4px; right: 4px; width: 25px; height: 25px; min-height: 25px; padding: 0; border: 0; border-radius: 50%; background: rgba(6,7,9,.82); opacity: 0; }
    .tile:hover button, .tile button:focus { opacity: 1; }

    .bank-section { margin-top: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
    .bank-header { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 14px 9px 18px; border-bottom: 1px solid var(--line); }
    .bank-title { display: flex; align-items: baseline; gap: 10px; }
    .bank-title h3 { margin: 0; font-size: 1rem; }
    .count { color: var(--muted); font-size: .8rem; }

    .asset-bank { min-height: 132px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; padding: 14px; }
    .empty { width: 100%; min-height: 102px; display: grid; place-items: center; color: var(--muted); text-align: center; border: 1px dashed #343b45; border-radius: 10px; font-size: .9rem; line-height: 1.7; padding: 20px; }

    #fileInput { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

    .drop-mask { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(5,7,9,.82); backdrop-filter: blur(8px); }
    .drop-mask.visible { display: grid; }
    .drop-card { border: 2px dashed var(--accent); border-radius: 22px; padding: 55px 80px; color: var(--accent); font-size: 1.25rem; font-weight: 800; background: rgba(234,255,91,.06); }

    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 120; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 11px 17px; border-radius: 99px; background: #f3f5f7; color: #16191d; font-weight: 700; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .recording-badge { display: none; }

    body.recording { background: #000; }
    body.recording .topbar, body.recording .room-bar, body.recording .board-header, body.recording .tier-tools, body.recording .bank-header { display: none; }
    body.recording .workspace { width: 100%; height: 100vh; padding: 0; margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) 132px; overflow: hidden; }
    body.recording .board { border: 0; border-radius: 0; min-height: 0; height: 100%; box-shadow: none; overflow: hidden; }
    body.recording .tier { grid-template-columns: clamp(115px, 13vw, 210px) minmax(0, 1fr); min-height: calc((100vh - 132px) / var(--tier-count)); height: calc((100vh - 132px) / var(--tier-count)); }
    body.recording .tier-name input { font-size: clamp(1rem, 2vw, 1.75rem); pointer-events: none; }
    body.recording .tier-drop { padding: 10px; align-content: center; background-image: none; }
    body.recording .tile { width: min(clamp(68px, 7.8vw, 122px), calc((100vh - 154px) / var(--tier-count))); height: min(clamp(68px, 7.8vw, 122px), calc((100vh - 154px) / var(--tier-count))); flex: 0 0 auto; }
    body.recording .tile button { display: none; }
    body.recording .bank-section { display: block; height: 132px; min-height: 132px; margin: 0; border: 0; border-top: 2px solid rgba(234,255,91,.72); border-radius: 0; background: #090b0e; overflow: hidden; }
    body.recording .asset-bank { height: 130px; min-height: 130px; flex-wrap: nowrap; align-items: center; align-content: center; overflow-x: auto; overflow-y: hidden; padding: 14px 18px; background: linear-gradient(90deg, rgba(234,255,91,.035), transparent 45%); }
    body.recording .asset-bank .empty { min-width: 100%; min-height: 96px; border-color: rgba(255,255,255,.12); }
    body.recording .recording-badge { display: block; position: fixed; right: 16px; bottom: 14px; z-index: 40; color: rgba(255,255,255,.42); font-size: 12px; letter-spacing: .08em; opacity: 0; transition: opacity .2s ease; }
    body.recording:hover .recording-badge { opacity: 1; }

    @media (max-width: 760px) {
      :root { --tile: 74px; }
      .topbar { align-items: flex-start; padding: 12px 14px; }
      .brand span { display: none; }
      .brand { min-width: 0; }
      .brand-mark { width: 38px; height: 38px; }
      .actions button { padding: 0 11px; }
      .actions .button-label { display: none; }
      .button-icon { margin-right: 0; }
      .workspace { padding: 14px; }
      .tier { grid-template-columns: 96px minmax(0, 1fr) 78px; min-height: 100px; }
      .tier-name { padding: 6px; }
      .tier-name input { font-size: .88rem; }
      .board-header { align-items: flex-start; }
      .board-header p { max-width: 28ch; }
      .room-bar { align-items: flex-start; padding: 10px 14px; }
      .room-people { display: none; }
      .room-choice { grid-template-columns: 1fr; }
      .room-or { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">夯</div>
        <div><h1>夯拉板</h1><span>视频创作者分档工具</span></div>
      </div>
      <div class="actions" aria-label="看板操作">
        <label class="theme-control"><span>主题</span><select id="themeSelect" aria-label="档位颜色主题"><option value="rainbow">彩虹色</option><option value="ember">红橙黄白</option></select></label>
        <button id="addTierBtn" type="button" title="增加一个档位"><span class="button-icon">＋</span><span class="button-label">加一档</span></button>
        <button id="uploadBtn" type="button" class="primary" title="批量上传图片"><span class="button-icon">↑</span><span class="button-label">上传图片</span></button>
        <button id="roomBtn" type="button" title="创建或加入联机房间"><span class="button-icon">◎</span><span class="button-label">联机房间</span></button>
        <button id="exportBtn" type="button" title="将当前分档结果导出为 PNG 图片"><span class="button-icon">⇩</span><span class="button-label">导出图片</span></button>
        <button id="recordBtn" type="button" title="隐藏控件并进入全屏"><span class="button-icon">●</span><span class="button-label">干净录制</span></button>
      </div>
    </header>

    <section id="roomBar" class="room-bar" aria-label="联机房间状态" hidden>
      <div class="room-info"><span class="online-dot" aria-hidden="true"></span><span>房间 <strong id="roomCode" class="room-code">000000</strong></span><span id="roomFinalLabel" class="room-final-label">已定稿</span></div>
      <div id="roomPeople" class="room-people">1 人在线</div>
      <div class="room-actions"><button id="copyRoomBtn" type="button">复制邀请</button><button id="finalizeBtn" class="finalize" type="button" hidden>锁定最终排名</button><button id="leaveRoomBtn" type="button">退出房间</button></div>
    </section>

    <main class="workspace">
      <div class="board-header">
        <div><input id="boardTitle" class="board-title" type="text" value="这期怎么排？" maxlength="80" aria-label="排序标题" title="点击修改排序标题"><p>点击标题可以改名；拖动图片进档位，点击档名可以直接修改。</p></div>
      </div>
      <section id="board" class="board" aria-label="分档看板"></section>

      <section class="bank-section" aria-label="待分档图片">
        <div class="bank-header">
          <div class="bank-title"><h3>待分档</h3><span id="itemCount" class="count">0 张</span></div>
          <button id="bankUploadBtn" type="button">＋ 添加图片</button>
        </div>
        <div id="assetBank" class="asset-bank" data-zone="bank"></div>
      </section>
    </main>
  </div>

  <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
  <div id="dropMask" class="drop-mask" aria-hidden="true"><div class="drop-card">松手即可添加图片</div></div>
  <div class="recording-badge">按 ESC 退出录制模式</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="roomModal" class="room-modal" aria-hidden="true">
    <section class="room-dialog" role="dialog" aria-modal="true" aria-labelledby="roomDialogTitle">
      <div class="room-dialog-header">
        <div><h2 id="roomDialogTitle">联机一起排</h2><p>创建房间后，把房间号或邀请链接发给连线嘉宾。</p></div>
        <button id="roomCloseBtn" class="room-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="room-form">
        <div class="room-field"><label for="nicknameInput">你的昵称</label><input id="nicknameInput" type="text" maxlength="24" placeholder="例如：主持人"></div>
        <div class="room-choice">
          <button id="createRoomBtn" class="primary room-submit" type="button">创建新房间</button>
          <span class="room-or">或者</span>
          <div class="room-field"><label for="joinCodeInput">输入 6 位房间号</label><input id="joinCodeInput" class="room-number" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button id="joinRoomBtn" class="room-submit" type="button">加入房间</button></div>
        </div>
        <p class="room-note">联机后，标题、主题、档位和图片调整会同步给房间内所有人。房主定稿后将暂停编辑。</p>
      </div>
    </section>
  </div>

  <div id="hostExitModal" class="room-modal" aria-hidden="true">
    <section class="room-dialog" role="dialog" aria-modal="true" aria-labelledby="hostExitTitle">
      <div class="room-dialog-header">
        <div><h2 id="hostExitTitle">交接或解散房间</h2><p>房主不能直接退出。你可以转让给其他参与者，或者解散整个房间。</p></div>
        <button id="hostExitCloseBtn" class="room-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="room-form">
        <div id="transferField" class="room-field"><label for="transferTargetSelect">转让给</label><select id="transferTargetSelect"></select></div>
        <div class="host-exit-actions">
          <button id="transferRoomBtn" class="primary" type="button">转让并退出</button>
          <button id="dissolveRoomBtn" class="danger-action" type="button">解散房间</button>
        </div>
        <p id="hostExitNote" class="room-note">解散后，所有参与者都会离开，房间链接立即失效。</p>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const THEMES = {
        rainbow: ['#f05b56', '#f09b53', '#f2d35d', '#8ecb67', '#62b9d8', '#8d7bd8', '#d27ac0'],
        ember: ['#ef4444', '#f97316', '#facc15', '#fde68a', '#f8fafc']
      };
      const state = {
        title: '这期怎么排？',
        theme: 'rainbow',
        tiers: [
          { id: crypto.randomUUID(), name: '夯', items: [] },
          { id: crypto.randomUUID(), name: '顶级', items: [] },
          { id: crypto.randomUUID(), name: '人上人', items: [] },
          { id: crypto.randomUUID(), name: 'NPC', items: [] },
          { id: crypto.randomUUID(), name: '拉完了', items: [] }
        ],
        bank: [],
        items: new Map(),
        draggingId: null,
        draggingTierId: null,
        applyingRemote: false,
        room: null
      };

      const board = document.querySelector('#board');
      const bank = document.querySelector('#assetBank');
      const fileInput = document.querySelector('#fileInput');
      const itemCount = document.querySelector('#itemCount');
      const dropMask = document.querySelector('#dropMask');
      const toast = document.querySelector('#toast');
      const roomModal = document.querySelector('#roomModal');
      const roomBar = document.querySelector('#roomBar');
      const hostExitModal = document.querySelector('#hostExitModal');
      let toastTimer;
      let externalDragDepth = 0;
      let roomSyncTimer;
      let roomPollTimer;
      let roomPresenceTimer;
      let syncInFlight = false;
      let syncQueued = false;
      let hostClaimInFlight = false;

      function say(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function canEdit() {
        if (!state.room?.finalized) return true;
        say('最终排名已锁定，请让房主先解锁');
        return false;
      }

      function serializeBoard(emptyItems = false) {
        return {
          title: state.title,
          theme: state.theme,
          tiers: state.tiers.map(tier => ({ ...tier, items: emptyItems ? [] : [...tier.items] })),
          bank: emptyItems ? [] : [...state.bank],
          items: emptyItems ? [] : [...state.items.values()].map(item => ({
            id: item.id,
            name: item.name,
            url: item.url,
            remoteId: item.remoteId || null
          }))
        };
      }

      function applyRemoteBoard(nextState) {
        if (!nextState) return;
        state.applyingRemote = true;
        state.items.forEach(item => {
          if (item.url?.startsWith('blob:')) URL.revokeObjectURL(item.url);
        });
        state.title = String(nextState.title || '这期怎么排？');
        state.theme = THEMES[nextState.theme] ? nextState.theme : 'rainbow';
        state.tiers = Array.isArray(nextState.tiers) ? nextState.tiers.map(tier => ({
          id: tier.id,
          name: tier.name,
          items: [...tier.items]
        })) : [];
        state.bank = Array.isArray(nextState.bank) ? [...nextState.bank] : [];
        state.items = new Map((nextState.items || []).map(item => [item.id, { ...item }]));
        document.querySelector('#boardTitle').value = state.title;
        document.querySelector('#themeSelect').value = state.theme;
        render();
        state.applyingRemote = false;
      }

      async function requestJson(url, options = {}) {
        let response;
        for (let attempt = 0; attempt < 2; attempt += 1) {
          try {
            response = await fetch(url, options);
            break;
          } catch (error) {
            if (attempt === 1) {
              const networkError = new Error('网络连接失败，请稍后重试');
              networkError.cause = error;
              throw networkError;
            }
            await new Promise(resolve => setTimeout(resolve, 450));
          }
        }
        let data;
        try { data = await response.json(); } catch (_) { data = { error: '服务器返回异常' }; }
        if (!response.ok) {
          const error = new Error(data.error || '联机请求失败');
          error.status = response.status;
          error.data = data;
          throw error;
        }
        return data;
      }

      function saveRoomSession() {
        if (!state.room) return sessionStorage.removeItem('hangla-room');
        sessionStorage.setItem('hangla-room', JSON.stringify({
          code: state.room.code,
          participantId: state.room.participantId,
          nickname: state.room.nickname,
          hostKey: state.room.hostKey || null
        }));
      }

      function updateRoomAddress(code = null) {
        const url = new URL(location.href);
        if (code) url.searchParams.set('room', code);
        else url.searchParams.delete('room');
        history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
      }

      function updateRoomUi(payload = {}) {
        if (!state.room) {
          roomBar.hidden = true;
          document.body.classList.remove('room-finalized');
          document.querySelector('#roomBtn .button-label').textContent = '联机房间';
          return;
        }
        if (typeof payload.version === 'number') state.room.version = payload.version;
        if (typeof payload.finalized === 'boolean') state.room.finalized = payload.finalized;
        if ('hostParticipantId' in payload) state.room.hostParticipantId = payload.hostParticipantId;
        if (Array.isArray(payload.participants)) state.room.participants = payload.participants;
        roomBar.hidden = false;
        document.querySelector('#roomCode').textContent = state.room.code;
        const people = state.room.participants || [];
        document.querySelector('#roomPeople').textContent = people.length
          ? `${people.length} 人在线 · ${people.map(person => person.name).join('、')}`
          : '正在连接…';
        const finalizeButton = document.querySelector('#finalizeBtn');
        finalizeButton.hidden = !state.room.hostKey;
        finalizeButton.textContent = state.room.finalized ? '解锁继续调整' : '锁定最终排名';
        document.querySelector('#leaveRoomBtn').textContent = state.room.hostKey ? '交接 / 解散' : '退出房间';
        document.body.classList.toggle('room-finalized', Boolean(state.room.finalized));
        document.querySelector('#roomBtn .button-label').textContent = `房间 ${state.room.code}`;
        document.querySelector('#addTierBtn').disabled = Boolean(state.room.finalized);
        document.querySelector('#uploadBtn').disabled = Boolean(state.room.finalized);
        document.querySelector('#bankUploadBtn').disabled = Boolean(state.room.finalized);
        document.querySelector('#themeSelect').disabled = Boolean(state.room.finalized);
        document.querySelector('#boardTitle').readOnly = Boolean(state.room.finalized);
        maybeClaimRoomHost();
      }

      async function maybeClaimRoomHost() {
        if (!state.room || state.room.hostKey || hostClaimInFlight) return;
        if (state.room.hostParticipantId !== state.room.participantId) return;
        const roomCode = state.room.code;
        hostClaimInFlight = true;
        try {
          const data = await requestJson(`/api/rooms/${roomCode}/claim-host`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ participantId: state.room.participantId })
          });
          if (!state.room || state.room.code !== roomCode) return;
          state.room.hostKey = data.hostKey;
          saveRoomSession();
          updateRoomUi(data);
          say('你已成为新房主');
        } catch (_) {
          // 下一轮同步会再次尝试接管。
        } finally {
          hostClaimInFlight = false;
        }
      }

      function scheduleRoomSync(delay = 80) {
        if (!state.room || state.room.syncPaused || state.room.finalized || state.applyingRemote) return;
        clearTimeout(roomSyncTimer);
        roomSyncTimer = setTimeout(pushRoomState, delay);
      }

      async function pushRoomState() {
        clearTimeout(roomSyncTimer);
        if (!state.room || state.room.syncPaused || state.room.finalized || state.applyingRemote) return;
        if (syncInFlight) {
          syncQueued = true;
          return;
        }
        syncInFlight = true;
        try {
          const data = await requestJson(`/api/rooms/${state.room.code}/sync`, {
            method: 'PUT',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              participantId: state.room.participantId,
              nickname: state.room.nickname,
              baseVersion: state.room.version,
              state: serializeBoard()
            })
          });
          updateRoomUi(data);
        } catch (error) {
          if ([409, 423].includes(error.status) && error.data?.state) {
            applyRemoteBoard(error.data.state);
            updateRoomUi(error.data);
            say(error.status === 423 ? '房主已锁定最终排名' : '已采用房间内较新的调整');
          } else {
            say('同步暂时中断，正在重试');
            syncQueued = true;
          }
        } finally {
          syncInFlight = false;
          if (syncQueued) {
            syncQueued = false;
            scheduleRoomSync(220);
          }
        }
      }

      async function pollRoom() {
        clearTimeout(roomPollTimer);
        if (!state.room) return;
        try {
          const data = await requestJson(`/api/rooms/${state.room.code}?since=${state.room.version}`);
          if (!syncInFlight && data.version > state.room.version && data.state) applyRemoteBoard(data.state);
          updateRoomUi(data);
        } catch (error) {
          if (error.status === 404) leaveRoom(false, '房间已失效');
        }
        if (state.room) roomPollTimer = setTimeout(pollRoom, 100);
      }

      async function keepRoomPresence() {
        clearTimeout(roomPresenceTimer);
        if (!state.room) return;
        try {
          const data = await requestJson(`/api/rooms/${state.room.code}/presence`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ participantId: state.room.participantId, nickname: state.room.nickname })
          });
          updateRoomUi(data);
        } catch (error) {
          if (error.status === 404) leaveRoom(false, '房间已失效');
        }
        if (state.room) roomPresenceTimer = setTimeout(keepRoomPresence, 8000);
      }

      function beginRoom(data, nickname, hostKey = null, applyState = true) {
        clearTimeout(roomPollTimer);
        clearTimeout(roomPresenceTimer);
        state.room = {
          code: data.code,
          participantId: data.participantId,
          nickname,
          hostKey,
          hostParticipantId: data.hostParticipantId || (hostKey ? data.participantId : null),
          version: data.version,
          finalized: Boolean(data.finalized),
          participants: data.participants || [],
          syncPaused: false
        };
        updateRoomAddress(data.code);
        if (applyState) applyRemoteBoard(data.state);
        updateRoomUi(data);
        saveRoomSession();
        closeRoomModal();
        roomPollTimer = setTimeout(pollRoom, 250);
        roomPresenceTimer = setTimeout(keepRoomPresence, 6000);
      }

      function leaveRoom(confirmFirst = true, message = '已退出联机房间') {
        if (confirmFirst && state.room?.hostKey) return openHostExitModal();
        if (confirmFirst && !confirm('退出房间后会保留当前画面，但不再同步其他人的调整。确定退出吗？')) return;
        clearTimeout(roomSyncTimer);
        clearTimeout(roomPollTimer);
        clearTimeout(roomPresenceTimer);
        state.room = null;
        updateRoomAddress();
        syncInFlight = false;
        syncQueued = false;
        saveRoomSession();
        updateRoomUi();
        render();
        say(message);
      }

      function openHostExitModal() {
        if (!state.room?.hostKey) return;
        const candidates = (state.room.participants || []).filter(person => person.id !== state.room.participantId);
        const select = document.querySelector('#transferTargetSelect');
        select.innerHTML = candidates.map(person => `<option value="${escapeHtml(person.id)}">${escapeHtml(person.name)}</option>`).join('');
        document.querySelector('#transferField').hidden = !candidates.length;
        document.querySelector('#transferRoomBtn').hidden = !candidates.length;
        document.querySelector('#hostExitNote').textContent = candidates.length
          ? '转让后你会退出；解散后所有参与者都会离开，房间链接立即失效。'
          : '当前没有其他参与者可以接任，房主只能解散房间。';
        hostExitModal.classList.add('open');
        hostExitModal.setAttribute('aria-hidden', 'false');
      }

      function closeHostExitModal() {
        hostExitModal.classList.remove('open');
        hostExitModal.setAttribute('aria-hidden', 'true');
      }

      async function transferRoomAndLeave() {
        if (!state.room?.hostKey) return;
        const button = document.querySelector('#transferRoomBtn');
        const targetParticipantId = document.querySelector('#transferTargetSelect').value;
        if (!targetParticipantId) return say('请选择接任房主');
        button.disabled = true;
        try {
          await pushRoomState();
          await requestJson(`/api/rooms/${state.room.code}/transfer`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ hostKey: state.room.hostKey, targetParticipantId })
          });
          closeHostExitModal();
          leaveRoom(false, '房主已转让，你已退出房间');
        } catch (error) {
          say(error.message || '转让失败');
        } finally {
          button.disabled = false;
        }
      }

      async function dissolveCurrentRoom() {
        if (!state.room?.hostKey) return;
        if (!confirm('确定解散房间吗？所有参与者都会离开，且无法恢复。')) return;
        const button = document.querySelector('#dissolveRoomBtn');
        button.disabled = true;
        try {
          await requestJson(`/api/rooms/${state.room.code}/dissolve`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ hostKey: state.room.hostKey })
          });
          closeHostExitModal();
          leaveRoom(false, '房间已解散');
        } catch (error) {
          say(error.message || '解散失败');
        } finally {
          button.disabled = false;
        }
      }

      function openRoomModal() {
        roomModal.classList.add('open');
        roomModal.setAttribute('aria-hidden', 'false');
        let savedName = state.room?.nickname || '';
        try { savedName ||= JSON.parse(sessionStorage.getItem('hangla-room') || 'null')?.nickname || ''; } catch (_) {}
        document.querySelector('#nicknameInput').value = savedName;
        setTimeout(() => document.querySelector(savedName ? '#joinCodeInput' : '#nicknameInput').focus(), 0);
      }

      function closeRoomModal() {
        roomModal.classList.remove('open');
        roomModal.setAttribute('aria-hidden', 'true');
      }

      async function mapWithConcurrency(entries, limit, worker) {
        const results = new Array(entries.length);
        let nextIndex = 0;
        async function run() {
          while (nextIndex < entries.length) {
            const index = nextIndex++;
            results[index] = await worker(entries[index], index);
          }
        }
        await Promise.all(Array.from({ length: Math.min(limit, entries.length) }, run));
        return results;
      }

      async function optimizeImageForUpload(blob) {
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(blob.type) || blob.size < 900000) return blob;
        try {
          const bitmap = await createImageBitmap(blob);
          const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          bitmap.close();
          const optimized = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', .86));
          return optimized && optimized.size < blob.size ? optimized : blob;
        } catch (_) {
          return blob;
        }
      }

      async function uploadBlobToRoom(blob, name) {
        const uploadBlob = await optimizeImageForUpload(blob);
        const response = await requestJson(`/api/rooms/${state.room.code}/images`, {
          method: 'POST',
          headers: { 'content-type': uploadBlob.type, 'x-file-name': encodeURIComponent(name) },
          body: uploadBlob
        });
        return response;
      }

      async function createRoom() {
        const button = document.querySelector('#createRoomBtn');
        const nickname = document.querySelector('#nicknameInput').value.trim();
        if (!nickname) return say('请先填写昵称');
        button.disabled = true;
        button.textContent = '创建中…';
        try {
          const participantId = crypto.randomUUID();
          const data = await requestJson('/api/rooms', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ participantId, nickname, state: serializeBoard(true) })
          });
          beginRoom(data, nickname, data.hostKey, false);
          state.room.syncPaused = true;
          const failed = [];
          await mapWithConcurrency([...state.items.values()], 4, async item => {
            try {
              const blob = await fetch(item.url).then(response => response.blob());
              const uploaded = await uploadBlobToRoom(blob, item.name);
              if (item.url.startsWith('blob:')) URL.revokeObjectURL(item.url);
              item.url = uploaded.url;
              item.remoteId = uploaded.id;
            } catch (_) {
              failed.push(item.id);
            }
          });
          failed.forEach(id => {
            const location = locateItem(id);
            if (location) location.list.splice(location.list.indexOf(id), 1);
            state.items.delete(id);
          });
          state.room.syncPaused = false;
          render();
          await pushRoomState();
          say(failed.length ? `房间已创建，${failed.length} 张图片上传失败` : `房间 ${data.code} 已创建`);
        } catch (error) {
          say(error.message || '创建房间失败');
        } finally {
          button.disabled = false;
          button.textContent = '创建新房间';
        }
      }

      async function joinRoom() {
        const button = document.querySelector('#joinRoomBtn');
        const nickname = document.querySelector('#nicknameInput').value.trim();
        const code = document.querySelector('#joinCodeInput').value.replace(/\D/g, '');
        if (!nickname) return say('请先填写昵称');
        if (code.length !== 6) return say('请输入 6 位房间号');
        if (allItemIds().length && !confirm('加入房间会用房间里的共同排名替换当前画面，确定加入吗？')) return;
        button.disabled = true;
        button.textContent = '加入中…';
        try {
          const participantId = crypto.randomUUID();
          const data = await requestJson(`/api/rooms/${code}/join`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ participantId, nickname })
          });
          beginRoom(data, nickname, null, true);
          say(`已加入房间 ${code}`);
        } catch (error) {
          say(error.message || '加入房间失败');
        } finally {
          button.disabled = false;
          button.textContent = '加入房间';
        }
      }

      async function resumeRoom() {
        let saved;
        try { saved = JSON.parse(sessionStorage.getItem('hangla-room') || 'null'); } catch (_) {}
        if (!saved?.code || !saved?.nickname || !saved?.participantId) return false;
        try {
          const data = await requestJson(`/api/rooms/${saved.code}/join`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ participantId: saved.participantId, nickname: saved.nickname })
          });
          beginRoom(data, saved.nickname, saved.hostKey || null, true);
          say(`已恢复房间 ${saved.code}`);
          return true;
        } catch (_) {
          sessionStorage.removeItem('hangla-room');
          return false;
        }
      }

      async function copyRoomInvite() {
        if (!state.room) return;
        const inviteUrl = `${location.origin}${location.pathname}?room=${state.room.code}`;
        try {
          await navigator.clipboard.writeText(`加入我的夯拉板房间 ${state.room.code}：${inviteUrl}`);
          say('邀请链接和房间号已复制');
        } catch (_) {
          window.prompt('复制这段邀请信息', `房间 ${state.room.code}：${inviteUrl}`);
        }
      }

      async function toggleFinalized() {
        if (!state.room?.hostKey) return;
        await pushRoomState();
        try {
          const data = await requestJson(`/api/rooms/${state.room.code}/finalize`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ hostKey: state.room.hostKey, finalized: !state.room.finalized })
          });
          if (data.state) applyRemoteBoard(data.state);
          updateRoomUi(data);
          say(data.finalized ? '最终排名已锁定，所有人暂停编辑' : '排名已解锁，可以继续调整');
        } catch (error) {
          say(error.message || '操作失败');
        }
      }

      function allItemIds() {
        return [...state.bank, ...state.tiers.flatMap(tier => tier.items)];
      }

      function themeColorAt(index) {
        const palette = THEMES[state.theme];
        return state.theme === 'rainbow' ? palette[index % palette.length] : palette[Math.min(index, palette.length - 1)];
      }

      function applyTheme(themeName) {
        if (!THEMES[themeName] || !canEdit()) return;
        state.theme = themeName;
        render();
        say(themeName === 'rainbow' ? '已切换为彩虹色' : '已切换为红橙黄白');
      }

      function locateItem(id) {
        if (state.bank.includes(id)) return { type: 'bank', list: state.bank };
        const tier = state.tiers.find(entry => entry.items.includes(id));
        return tier ? { type: 'tier', list: tier.items, tier } : null;
      }

      function moveItem(id, targetType, targetId, beforeId = null) {
        if (!canEdit()) return;
        const source = locateItem(id);
        if (!source) return;
        source.list.splice(source.list.indexOf(id), 1);
        const target = targetType === 'bank' ? state.bank : state.tiers.find(t => t.id === targetId)?.items;
        if (!target) return;
        const targetIndex = beforeId ? target.indexOf(beforeId) : -1;
        target.splice(targetIndex >= 0 ? targetIndex : target.length, 0, id);
        render();
      }

      function tileElement(id) {
        const item = state.items.get(id);
        const tile = document.createElement('article');
        tile.className = 'tile';
        tile.draggable = !state.room?.finalized;
        tile.dataset.itemId = id;
        tile.title = item.name;
        tile.innerHTML = `<img alt="${escapeHtml(item.name)}"><button type="button" aria-label="删除 ${escapeHtml(item.name)}">×</button>`;
        tile.querySelector('img').src = item.url;

        tile.addEventListener('dragstart', event => {
          if (!canEdit()) return event.preventDefault();
          state.draggingId = id;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', id);
          requestAnimationFrame(() => tile.classList.add('dragging'));
        });
        tile.addEventListener('dragend', () => {
          state.draggingId = null;
          tile.classList.remove('dragging');
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });
        tile.addEventListener('dragover', event => {
          if (!state.draggingId || state.draggingId === id) return;
          event.preventDefault();
        });
        tile.addEventListener('drop', event => {
          if (!state.draggingId || state.draggingId === id) return;
          event.preventDefault();
          event.stopPropagation();
          const parent = tile.parentElement;
          moveItem(state.draggingId, parent.dataset.zone, parent.dataset.tierId, id);
        });
        tile.querySelector('button').addEventListener('click', () => removeItem(id));
        return tile;
      }

      function escapeHtml(value) {
        return value.replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
      }

      function attachZoneEvents(zone, type, id = '') {
        zone.addEventListener('dragover', event => {
          if (!state.draggingId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          zone.classList.add('drag-over');
        });
        zone.addEventListener('dragleave', event => {
          if (!zone.contains(event.relatedTarget)) zone.classList.remove('drag-over');
        });
        zone.addEventListener('drop', event => {
          if (!state.draggingId) return;
          event.preventDefault();
          zone.classList.remove('drag-over');
          moveItem(state.draggingId, type, id);
        });
      }

      function render() {
        board.innerHTML = '';
        document.body.style.setProperty('--tier-count', Math.max(state.tiers.length, 1));
        state.tiers.forEach((tier, index) => {
          const row = document.createElement('div');
          row.className = 'tier';
          row.dataset.tierId = tier.id;
          row.style.setProperty('--tier-color', themeColorAt(index));
          row.innerHTML = `
            <div class="tier-name"><input value="${escapeHtml(tier.name)}" aria-label="档位名称"></div>
            <div class="tier-drop" data-zone="tier" data-tier-id="${tier.id}"></div>
            <div class="tier-tools">
              <button class="drag-tier" type="button" draggable="true" aria-label="拖动 ${escapeHtml(tier.name)} 档调整顺序" title="拖动调整档位顺序">⠿</button>
              <button class="delete-tier" type="button" aria-label="删除 ${escapeHtml(tier.name)} 档">×</button>
            </div>`;
          const input = row.querySelector('input');
          input.readOnly = Boolean(state.room?.finalized);
          input.addEventListener('input', () => {
            if (!canEdit()) return;
            tier.name = input.value;
            scheduleRoomSync(100);
          });
          row.querySelector('.delete-tier').addEventListener('click', () => deleteTier(tier.id));
          const dragHandle = row.querySelector('.drag-tier');
          dragHandle.draggable = !state.room?.finalized;
          dragHandle.addEventListener('dragstart', event => {
            if (!canEdit()) return event.preventDefault();
            state.draggingTierId = tier.id;
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', `tier:${tier.id}`);
          });
          dragHandle.addEventListener('dragend', () => {
            state.draggingTierId = null;
            document.querySelectorAll('.tier-drag-before, .tier-drag-after').forEach(el => el.classList.remove('tier-drag-before', 'tier-drag-after'));
          });
          row.addEventListener('dragover', event => {
            if (!state.draggingTierId || state.draggingTierId === tier.id) return;
            event.preventDefault();
            const isAfter = event.clientY > row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
            row.classList.toggle('tier-drag-before', !isAfter);
            row.classList.toggle('tier-drag-after', isAfter);
          });
          row.addEventListener('dragleave', event => {
            if (!row.contains(event.relatedTarget)) row.classList.remove('tier-drag-before', 'tier-drag-after');
          });
          row.addEventListener('drop', event => {
            if (!state.draggingTierId || state.draggingTierId === tier.id) return;
            event.preventDefault();
            event.stopPropagation();
            const isAfter = event.clientY > row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
            const movingIndex = state.tiers.findIndex(entry => entry.id === state.draggingTierId);
            const [movingTier] = state.tiers.splice(movingIndex, 1);
            let targetIndex = state.tiers.findIndex(entry => entry.id === tier.id);
            if (isAfter) targetIndex += 1;
            state.tiers.splice(targetIndex, 0, movingTier);
            state.draggingTierId = null;
            render();
            say('档位顺序已调整');
          });
          const zone = row.querySelector('.tier-drop');
          attachZoneEvents(zone, 'tier', tier.id);
          tier.items.forEach(itemId => zone.appendChild(tileElement(itemId)));
          board.appendChild(row);
        });

        bank.innerHTML = '';
        attachZoneEvents(bank, 'bank');
        state.bank.forEach(id => bank.appendChild(tileElement(id)));
        if (!state.bank.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.innerHTML = allItemIds().length ? '所有图片都已经完成分档。<br>也可以把图片拖回这里。' : '把图片拖到这里，或点击“上传图片”开始。<br>支持一次选择多张。';
          bank.appendChild(empty);
        }
        itemCount.textContent = `${state.bank.length} 张`;
        if (state.room && !state.applyingRemote) scheduleRoomSync();
      }

      function addTier(name = '新档位') {
        if (!canEdit()) return;
        state.tiers.push({ id: crypto.randomUUID(), name, items: [] });
        render();
        say('已增加一个档位');
      }

      function deleteTier(id) {
        if (!canEdit()) return;
        if (state.tiers.length <= 1) return say('至少保留一个档位');
        const tier = state.tiers.find(entry => entry.id === id);
        if (!tier || !confirm(`删除“${tier.name || '未命名'}”档？其中图片会回到待分档区。`)) return;
        state.bank.push(...tier.items);
        state.tiers = state.tiers.filter(entry => entry.id !== id);
        render();
        say('档位已删除');
      }

      function removeItem(id) {
        if (!canEdit()) return;
        const item = state.items.get(id);
        if (!item) return;
        const location = locateItem(id);
        if (location) location.list.splice(location.list.indexOf(id), 1);
        URL.revokeObjectURL(item.url);
        state.items.delete(id);
        render();
      }

      async function addFiles(fileList) {
        if (!canEdit()) return;
        const files = [...fileList].filter(file => file.type.startsWith('image/'));
        if (!files.length) return say('请选择图片文件');
        if (state.room) say(`正在上传 ${files.length} 张图片…`);
        const results = await mapWithConcurrency(files, state.room ? 4 : 12, async file => {
          const id = crypto.randomUUID();
          const name = file.name.replace(/\.[^.]+$/, '');
          try {
            if (state.room) {
              const uploaded = await uploadBlobToRoom(file, name);
              state.items.set(id, { id, name, url: uploaded.url, remoteId: uploaded.id });
            } else {
              state.items.set(id, { id, name, url: URL.createObjectURL(file), remoteId: null });
            }
            return id;
          } catch (error) {
            console.error(error);
            return null;
          }
        });
        const successfulIds = results.filter(Boolean);
        state.bank.push(...successfulIds);
        const added = successfulIds.length;
        render();
        say(added === files.length ? `已添加 ${added} 张图片` : `已添加 ${added} 张，${files.length - added} 张失败`);
      }

      function roundedRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function drawFittedText(ctx, text, x, y, maxWidth, maxSize = 34, minSize = 20) {
        let size = maxSize;
        do {
          ctx.font = `900 ${size}px Inter, "PingFang SC", "Microsoft YaHei", sans-serif`;
          if (ctx.measureText(text).width <= maxWidth) break;
          size -= 1;
        } while (size > minSize);
        ctx.fillText(text, x, y, maxWidth);
      }

      function drawCoverImage(ctx, image, x, y, size) {
        const sourceRatio = image.naturalWidth / image.naturalHeight;
        let sourceWidth = image.naturalWidth;
        let sourceHeight = image.naturalHeight;
        let sourceX = 0;
        let sourceY = 0;
        if (sourceRatio > 1) {
          sourceWidth = image.naturalHeight;
          sourceX = (image.naturalWidth - sourceWidth) / 2;
        } else {
          sourceHeight = image.naturalWidth;
          sourceY = (image.naturalHeight - sourceHeight) / 2;
        }
        ctx.save();
        roundedRect(ctx, x, y, size, size, 10);
        ctx.clip();
        ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, size, size);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,.18)';
        ctx.lineWidth = 2;
        roundedRect(ctx, x, y, size, size, 10);
        ctx.stroke();
      }

      function loadExportImage(url) {
        return new Promise(resolve => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = url;
        });
      }

      function drawTierLabel(ctx, name, x, y, width, height) {
        const value = (name || '未命名').trim() || '未命名';
        const maxChars = 7;
        const lines = [];
        for (let index = 0; index < value.length; index += maxChars) lines.push(value.slice(index, index + maxChars));
        const visibleLines = lines.slice(0, 3);
        if (lines.length > 3) visibleLines[2] = `${visibleLines[2].slice(0, Math.max(1, maxChars - 1))}…`;
        const fontSize = visibleLines.length > 2 ? 23 : 27;
        const lineHeight = fontSize * 1.24;
        const startY = y + height / 2 - ((visibleLines.length - 1) * lineHeight) / 2;
        ctx.fillStyle = '#151515';
        ctx.font = `900 ${fontSize}px Inter, "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        visibleLines.forEach((line, index) => ctx.fillText(line, x + width / 2, startY + index * lineHeight, width - 24));
      }

      async function exportBoard() {
        const exportButton = document.querySelector('#exportBtn');
        const rankedIds = state.tiers.flatMap(tier => tier.items);
        if (!rankedIds.length) return say('请先将至少一张图片放入档位');
        const exportTitle = state.title.trim() || '未命名排序';

        exportButton.disabled = true;
        exportButton.setAttribute('aria-busy', 'true');
        const originalLabel = exportButton.querySelector('.button-label').textContent;
        exportButton.querySelector('.button-label').textContent = '生成中';

        try {
          await document.fonts?.ready;
          const loadedEntries = await Promise.all(rankedIds.map(async id => {
            const item = state.items.get(id);
            return [id, item ? await loadExportImage(item.url) : null];
          }));
          const loadedImages = new Map(loadedEntries);

          const canvasWidth = 1600;
          const outerPadding = 44;
          const headerHeight = 146;
          const footerHeight = 74;
          const labelWidth = 190;
          const tileSize = 116;
          const gap = 12;
          const rowPadding = 18;
          const boardWidth = canvasWidth - outerPadding * 2;
          const contentWidth = boardWidth - labelWidth;
          const perRow = Math.max(1, Math.floor((contentWidth - rowPadding * 2 + gap) / (tileSize + gap)));
          const rowHeights = state.tiers.map(tier => {
            const imageRows = Math.max(1, Math.ceil(tier.items.length / perRow));
            return Math.max(154, rowPadding * 2 + imageRows * tileSize + (imageRows - 1) * gap);
          });
          const canvasHeight = headerHeight + rowHeights.reduce((sum, height) => sum + height, 0) + footerHeight;
          const targetPixels = 26000000;
          const scale = Math.min(2, Math.max(.65, Math.sqrt(targetPixels / (canvasWidth * canvasHeight))));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(canvasWidth * scale);
          canvas.height = Math.round(canvasHeight * scale);
          const ctx = canvas.getContext('2d');
          ctx.scale(scale, scale);

          ctx.fillStyle = '#0b0d10';
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          ctx.fillStyle = '#eaff5b';
          roundedRect(ctx, outerPadding, 42, 58, 58, 14);
          ctx.fill();
          ctx.fillStyle = '#151800';
          ctx.font = '1000 31px Inter, "PingFang SC", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('夯', outerPadding + 29, 72);

          ctx.fillStyle = '#f5f6f7';
          ctx.textAlign = 'left';
          drawFittedText(ctx, exportTitle, outerPadding + 78, 61, canvasWidth - outerPadding * 2 - 350);
          ctx.fillStyle = '#9aa3ae';
          ctx.font = '500 20px Inter, "PingFang SC", sans-serif';
          ctx.fillText('夯拉板 · 分档结果', outerPadding + 78, 91);
          ctx.textAlign = 'right';
          ctx.fillText(state.theme === 'rainbow' ? '彩虹色主题' : '红橙黄白主题', canvasWidth - outerPadding, 74);

          let rowY = headerHeight;
          state.tiers.forEach((tier, tierIndex) => {
            const rowHeight = rowHeights[tierIndex];
            ctx.fillStyle = themeColorAt(tierIndex);
            ctx.fillRect(outerPadding, rowY, labelWidth, rowHeight);
            ctx.fillStyle = '#15191f';
            ctx.fillRect(outerPadding + labelWidth, rowY, contentWidth, rowHeight);
            drawTierLabel(ctx, tier.name, outerPadding, rowY, labelWidth, rowHeight);

            tier.items.forEach((id, itemIndex) => {
              const column = itemIndex % perRow;
              const imageRow = Math.floor(itemIndex / perRow);
              const x = outerPadding + labelWidth + rowPadding + column * (tileSize + gap);
              const y = rowY + rowPadding + imageRow * (tileSize + gap);
              const image = loadedImages.get(id);
              if (image) {
                drawCoverImage(ctx, image, x, y, tileSize);
              } else {
                ctx.fillStyle = '#2a3039';
                roundedRect(ctx, x, y, tileSize, tileSize, 10);
                ctx.fill();
              }
            });

            ctx.strokeStyle = '#2a3039';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(outerPadding, rowY + rowHeight);
            ctx.lineTo(canvasWidth - outerPadding, rowY + rowHeight);
            ctx.stroke();
            rowY += rowHeight;
          });

          ctx.strokeStyle = '#343b45';
          ctx.lineWidth = 2;
          ctx.strokeRect(outerPadding, headerHeight, boardWidth, rowY - headerHeight);

          ctx.fillStyle = '#9aa3ae';
          ctx.font = '500 18px Inter, "PingFang SC", sans-serif';
          ctx.textBaseline = 'middle';
          ctx.textAlign = 'left';
          ctx.fillText(`共 ${rankedIds.length} 张 · ${state.tiers.length} 个档位`, outerPadding, rowY + footerHeight / 2);
          ctx.textAlign = 'right';
          ctx.fillText('由夯拉板生成', canvasWidth - outerPadding, rowY + footerHeight / 2);

          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
          if (!blob) throw new Error('无法生成图片');
          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = downloadUrl;
          const safeTitle = exportTitle.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80) || '未命名排序';
          link.download = `${safeTitle}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
          say(state.bank.length ? `已导出，待分档的 ${state.bank.length} 张未包含` : '分档结果已导出为 PNG');
        } catch (error) {
          console.error(error);
          say('导出失败，请稍后重试');
        } finally {
          exportButton.disabled = false;
          exportButton.removeAttribute('aria-busy');
          exportButton.querySelector('.button-label').textContent = originalLabel;
        }
      }

      async function toggleRecording(force) {
        const entering = typeof force === 'boolean' ? force : !document.body.classList.contains('recording');
        document.body.classList.toggle('recording', entering);
        if (entering) {
          try { await document.documentElement.requestFullscreen?.(); } catch (_) {}
        } else if (document.fullscreenElement) {
          try { await document.exitFullscreen(); } catch (_) {}
        }
      }

      document.querySelector('#addTierBtn').addEventListener('click', () => addTier());
      document.querySelector('#boardTitle').addEventListener('input', event => {
        if (!canEdit()) return;
        state.title = event.target.value;
        scheduleRoomSync(100);
      });
      document.querySelector('#themeSelect').addEventListener('change', event => applyTheme(event.target.value));
      document.querySelector('#uploadBtn').addEventListener('click', () => fileInput.click());
      document.querySelector('#bankUploadBtn').addEventListener('click', () => fileInput.click());
      document.querySelector('#roomBtn').addEventListener('click', () => state.room ? copyRoomInvite() : openRoomModal());
      document.querySelector('#roomCloseBtn').addEventListener('click', closeRoomModal);
      document.querySelector('#createRoomBtn').addEventListener('click', createRoom);
      document.querySelector('#joinRoomBtn').addEventListener('click', joinRoom);
      document.querySelector('#copyRoomBtn').addEventListener('click', copyRoomInvite);
      document.querySelector('#finalizeBtn').addEventListener('click', toggleFinalized);
      document.querySelector('#leaveRoomBtn').addEventListener('click', () => leaveRoom(true));
      document.querySelector('#hostExitCloseBtn').addEventListener('click', closeHostExitModal);
      document.querySelector('#transferRoomBtn').addEventListener('click', transferRoomAndLeave);
      document.querySelector('#dissolveRoomBtn').addEventListener('click', dissolveCurrentRoom);
      document.querySelector('#joinCodeInput').addEventListener('input', event => {
        event.target.value = event.target.value.replace(/\D/g, '').slice(0, 6);
      });
      roomModal.addEventListener('click', event => { if (event.target === roomModal) closeRoomModal(); });
      hostExitModal.addEventListener('click', event => { if (event.target === hostExitModal) closeHostExitModal(); });
      document.querySelector('#exportBtn').addEventListener('click', exportBoard);
      document.querySelector('#recordBtn').addEventListener('click', () => toggleRecording(true));
      fileInput.addEventListener('change', async () => { await addFiles(fileInput.files); fileInput.value = ''; });

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && roomModal.classList.contains('open')) closeRoomModal();
        if (event.key === 'Escape' && hostExitModal.classList.contains('open')) closeHostExitModal();
        if (event.key === 'Escape' && document.body.classList.contains('recording')) toggleRecording(false);
        if (event.key.toLowerCase() === 'r' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) toggleRecording();
      });
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) document.body.classList.remove('recording');
      });

      window.addEventListener('dragenter', event => {
        if (!event.dataTransfer?.types.includes('Files')) return;
        externalDragDepth++;
        dropMask.classList.add('visible');
      });
      window.addEventListener('dragleave', event => {
        if (!event.dataTransfer?.types.includes('Files')) return;
        externalDragDepth--;
        if (externalDragDepth <= 0) { externalDragDepth = 0; dropMask.classList.remove('visible'); }
      });
      window.addEventListener('dragover', event => {
        if (event.dataTransfer?.types.includes('Files')) event.preventDefault();
      });
      window.addEventListener('drop', event => {
        if (!event.dataTransfer?.files?.length) return;
        event.preventDefault();
        externalDragDepth = 0;
        dropMask.classList.remove('visible');
        addFiles(event.dataTransfer.files);
      });

      function registerWebMcpTools() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const lifecycle = new AbortController();
        const options = { signal: lifecycle.signal };
        const onError = error => console.warn('WebMCP tool registration failed', error);
        const register = tool => {
          try { Promise.resolve(context.registerTool(tool, options)).catch(onError); } catch (error) { onError(error); }
        };

        register({
          name: 'set_tier_theme',
          title: '设置档位主题',
          description: '将所有现有档位切换为彩虹色或红橙黄白配色。',
          inputSchema: { type: 'object', properties: { theme: { type: 'string', enum: ['rainbow', 'ember'] } }, required: ['theme'], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            if (!input || !THEMES[input.theme]) throw new Error('主题必须是 rainbow 或 ember');
            applyTheme(input.theme);
            return { applied: true, theme: state.theme, colors: state.tiers.map((_, index) => themeColorAt(index)) };
          }
        });

        register({
          name: 'add_tier',
          title: '增加档位',
          description: '在夯拉板底部增加一个新的空档位。',
          inputSchema: { type: 'object', properties: { name: { type: 'string', minLength: 1, maxLength: 30 } }, required: ['name'], additionalProperties: false },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            if (!input || typeof input.name !== 'string' || !input.name.trim() || input.name.length > 30) throw new Error('档位名称必须是 1–30 个字符');
            addTier(input.name.trim());
            return { added: true, tierName: input.name.trim(), tierCount: state.tiers.length };
          }
        });

        register({
          name: 'read_board',
          title: '读取看板',
          description: '读取当前档位名称以及每档图片数量，不修改看板。',
          inputSchema: { type: 'object', properties: {}, additionalProperties: false },
          annotations: { readOnlyHint: true, untrustedContentHint: true },
          execute() {
            return { tiers: state.tiers.map(tier => ({ name: tier.name, itemCount: tier.items.length })), unrankedCount: state.bank.length };
          }
        });
      }

      render();
      registerWebMcpTools();
      (async () => {
        const resumed = await resumeRoom();
        if (resumed) return;
        const invitedCode = new URLSearchParams(location.search).get('room')?.replace(/\D/g, '').slice(0, 6);
        if (invitedCode?.length === 6) {
          document.querySelector('#joinCodeInput').value = invitedCode;
          openRoomModal();
        }
      })();
    })();
  </script>
</body>
</html>
